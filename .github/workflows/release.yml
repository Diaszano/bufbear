name: Release and Package

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release and VSIX package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot release tags
        shell: bash
        run: .github/scripts/resolve-release-tag.sh snapshot "$RUNNER_TEMP/release-tags-before.txt"

      - name: Create semantic release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec semantic-release

      - name: Resolve published version
        id: release
        shell: bash
        run: .github/scripts/resolve-release-tag.sh resolve "$RUNNER_TEMP/release-tags-before.txt" "$GITHUB_OUTPUT"

      - name: Check Marketplace credentials
        id: marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: echo "available=$([[ -n \"$VSCE_PAT\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: steps.release.outputs.published == 'true' && steps.marketplace.outputs.available == 'true'
        run: npx vsce publish --packagePath bufbear-${{ steps.release.outputs.version }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Report Marketplace publication skipped
        if: steps.release.outputs.published == 'true' && steps.marketplace.outputs.available != 'true'
        run: echo "VSCE_PAT is not configured; skipping VS Code Marketplace publication."
