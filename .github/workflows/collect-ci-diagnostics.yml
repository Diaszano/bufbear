name: Collect CI diagnostics

on:
  push:
    branches:
      - chore/optimize-ignore-files

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: chore/optimize-ignore-files
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          npm run lint > ci-lint.log 2>&1
          echo "exit_code=$?" >> ci-lint.log

          npm run check-types > ci-types.log 2>&1
          echo "exit_code=$?" >> ci-types.log

          npm run package:vsix > ci-package.log 2>&1
          echo "exit_code=$?" >> ci-package.log

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-lint.log ci-types.log ci-package.log
          git commit -m "ci: capture tooling diagnostics"
          git push origin HEAD:chore/optimize-ignore-files
