name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/validate-commits.sh "$FROM_SHA" "$TO_SHA"

      - name: Validate PR target branch policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [[ "${{ github.head_ref }}" != "dev" && "${{ github.head_ref }}" != "development" ]]; then
            echo "::error::Only pull requests coming from the 'dev' (or 'development') branch are allowed to be merged into 'main'."
            exit 1
          fi

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-diagnostics
          path: lint.log
          retention-days: 1
      - name: Check types
        run: npm run check-types

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up pinned Buf CLI
        # Reviewed buf-setup-action commit for reproducible CI.
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.61.0
      - name: Verify Buf CLI
        run: buf --version
        env:
          BUF_VERSION: 1.61.0
      - name: Unit Tests
        run: npm run test:unit
      - name: Headless Integration Tests
        env:
          BUF_VERSION: 1.61.0
          BUF_BIN: buf
        run: xvfb-run -a npm run test:integration

  test-release:
    name: Test release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test release configuration
        run: npm run test:release

  build:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package VSIX
        shell: bash
        run: |
          set -o pipefail
          npm run package:vsix 2>&1 | tee package.log
      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-diagnostics
          path: package.log
          retention-days: 1
      - name: Verify VSIX package contract
        run: npm run test:package

  release:
    name: Release and publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: quality
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  quality:
    name: Quality gates
    needs: [commitlint, lint, test, test-release, build]
    runs-on: ubuntu-latest
    if: always() && needs.commitlint.result == 'success' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.test-release.result == 'success' && needs.build.result == 'success'
    steps:
      - run: echo "All quality gates passed"
